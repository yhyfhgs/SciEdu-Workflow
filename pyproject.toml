[project]
name = "mathforge"
version = "0.1.0"
description = "AI-driven university mathematics education platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf4llm>=0.0.10"]
pdf-ml = ["marker-pdf>=1.0"]
docx = ["python-docx>=1.0"]
gemini = ["google-genai>=1.0"]
db = ["chromadb>=0.5", "aiosqlite>=0.20"]
compute = ["sympy>=1.12", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
all = ["mathforge[gemini,pdf,db,compute,dev]"]

[project.scripts]
mathforge = "mathforge.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathforge"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mathforge"]
mypy_path = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
