<text x="124" y="106" text-anchor="middle" font-size="10.5" fill="#5F6368">Next.js + KaTeX</text>
<rect x="222" y="68" width="176" height="50" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
<text x="310" y="89" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A2B4A">App</text>
<text x="310" y="106" text-anchor="middle" font-size="10.5" fill="#5F6368">iOS / Android</text>
<rect x="408" y="68" width="176" height="50" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
<text x="496" y="89" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A2B4A">微信小程序</text>
<text x="496" y="106" text-anchor="middle" font-size="10.5" fill="#5F6368">Taro / uni-app</text>
<rect x="594" y="68" width="176" height="50" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
