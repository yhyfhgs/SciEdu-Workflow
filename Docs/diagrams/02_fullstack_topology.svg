<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>全平台产品拓扑</title>
<desc>Web/App/小程序/API 四端经 API Gateway 接入统一 SaaS 后端（身份、生成编排、题库、计费四服务 + PostgreSQL）；私有化与定制 API 为物理隔离实例，复用同一代码内核但独立部署、数据不出域。</desc>
<defs>
<marker id="t_blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1A73E8"/></marker>
</defs>
<rect x="20" y="34" width="784" height="410" rx="12" fill="#F6FAFF" stroke="#AECBFA" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="36" y="56" font-size="14" font-weight="700" fill="#0B5394">共享统一 SaaS 后端 · 多端共用 / 逻辑隔离</text>
<rect x="20" y="462" width="900" height="140" rx="12" fill="#FAF5FE" stroke="#D7AEFB" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="36" y="484" font-size="14" font-weight="700" fill="#6A1B9A">物理隔离实例 · 数据不出域</text>
