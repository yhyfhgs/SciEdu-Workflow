<text x="403" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5394">统一数据层 · PostgreSQL + pgvector</text>
<text x="403" y="395" text-anchor="middle" font-size="10.5" fill="#3C4043">业务表带 tenant_id 行级隔离 · 公共题库全局只读</text>
<path d="M310,406 V432 H403 V462" stroke="#E8910C" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<text x="412" y="450" font-size="10.5" fill="#8A5A12">复用同一代码内核（非数据连接）</text>
<rect x="44" y="498" width="412" height="88" rx="8" fill="#F3E8FD" stroke="#8430CE" stroke-width="2"/>
<text x="250" y="524" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4A148C">私有化部署实例</text>
<text x="250" y="544" text-anchor="middle" font-size="10.5" fill="#6A1B9A">独立后端 + 独立题库 + 本地/自带模型</text>
<text x="250" y="562" text-anchor="middle" font-size="10.5" fill="#6A1B9A">离线可用 · 白标</text>
<rect x="480" y="498" width="412" height="88" rx="8" fill="#F3E8FD" stroke="#8430CE" stroke-width="2"/>
<text x="686" y="524" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4A148C">定制 API 实例</text>
<text x="686" y="544" text-anchor="middle" font-size="10.5" fill="#6A1B9A">独立租户库 + 独立配额</text>
<text x="686" y="562" text-anchor="middle" font-size="10.5" fill="#6A1B9A">完全隔离 · 数据不出域</text>
</svg>
