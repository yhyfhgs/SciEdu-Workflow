<rect x="408" y="238" width="176" height="60" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
<text x="496" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A2B4A">题库/数据</text>
<text x="496" y="280" text-anchor="middle" font-size="10.5" fill="#5F6368">公共只读 + 租户私有</text>
<rect x="594" y="238" width="176" height="60" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
<text x="682" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A2B4A">计费/配额</text>
