<text x="682" y="106" text-anchor="middle" font-size="10.5" fill="#5F6368">API Key</text>
</g>
<g stroke="#1A73E8" stroke-width="2" fill="none">
<path d="M124,118 V150" marker-end="url(#t_blue)"/><path d="M310,118 V150" marker-end="url(#t_blue)"/>
<path d="M496,118 V150" marker-end="url(#t_blue)"/><path d="M682,118 V150" marker-end="url(#t_blue)"/>
</g>
<rect x="36" y="150" width="734" height="52" rx="7" fill="#D2E3FC" stroke="#1A73E8" stroke-width="2"/>
<text x="403" y="172" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B5394">API Gateway</text>
<text x="403" y="190" text-anchor="middle" font-size="11" fill="#3C4043">统一鉴权 · 限流配额 · 计费埋点</text>
