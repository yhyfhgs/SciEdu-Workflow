<text x="124" y="280" text-anchor="middle" font-size="10.5" fill="#5F6368">统一 user_id · 多端登录</text>
<rect x="222" y="238" width="176" height="60" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
