<rect x="828" y="110" width="15" height="11" rx="2" fill="#F3E8FD" stroke="#8430CE" stroke-width="1.5"/><text x="850" y="120">隔离实例</text>
<line x1="828" y1="138" x2="845" y2="138" stroke="#1A73E8" stroke-width="2"/><text x="850" y="142">数据流</text>
<line x1="828" y1="158" x2="845" y2="158" stroke="#E8910C" stroke-width="2" stroke-dasharray="5 3"/><text x="850" y="162">内核复用</text>
</g>
<g>
<rect x="36" y="68" width="176" height="50" rx="7" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
