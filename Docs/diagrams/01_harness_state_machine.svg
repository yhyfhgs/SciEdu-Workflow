<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>QGenAgent Harness 状态机</title>
<desc>题目生成 9 节点状态机：检索→生成→预筛→求解→验证→标注→入库的主流程，失败分支汇入诊断节点，再分流到进化重写、重新生成或失败终止。</desc>
<defs>
