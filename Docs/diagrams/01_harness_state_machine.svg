<text x="170" y="646" text-anchor="middle" font-size="11" fill="#5F6368">relations+trace · 0 LLM</text>
<ellipse cx="170" cy="700" rx="92" ry="24" fill="#E6F4EA" stroke="#188038" stroke-width="2"/>
<text x="170" y="705" text-anchor="middle" font-size="14" font-weight="600" fill="#0B5394">END · 成功产出</text>
