<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>分阶段实施路线图</title>
<desc>六阶段甘特图：P0 止血、P1 Harness 重构、P1.5 检索（与 P1 并行）属内核；P2 服务化、P3 多端与隔离、P4 增长属产品化。横轴为周。</desc>
<defs>
<marker id="r_arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#8430CE"/></marker>
</defs>
<g font-size="11.5" fill="#3C4043">
<rect x="700" y="10" width="252" height="30" rx="7" fill="#F8F9FA" stroke="#DADCE0"/>
<rect x="712" y="19" width="15" height="11" rx="2" fill="#1A73E8"/><text x="733" y="29">内核阶段</text>
<rect x="812" y="19" width="15" height="11" rx="2" fill="#8430CE"/><text x="833" y="29">产品化阶段</text>
</g>
<g stroke="#E8EAED" stroke-width="1">
<line x1="175" y1="52" x2="175" y2="440"/><line x1="300" y1="52" x2="300" y2="440"/>
<line x1="425" y1="52" x2="425" y2="440"/><line x1="550" y1="52" x2="550" y2="440"/>
<line x1="675" y1="52" x2="675" y2="440"/><line x1="800" y1="52" x2="800" y2="440"/><line x1="925" y1="52" x2="925" y2="440"/>
</g>
<g font-size="11" fill="#80868B" text-anchor="middle">
<text x="175" y="46">第0周</text><text x="300" y="46">4</text><text x="425" y="46">8</text><text x="550" y="46">12</text><text x="675" y="46">16</text><text x="800" y="46">20</text><text x="925" y="46">24周</text>
</g>
