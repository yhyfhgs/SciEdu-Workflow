<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="components-title components-desc" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <title id="components-title">QGen 前端组件分解目标态</title>
  <desc id="components-desc">把单一 IIFE 分解为状态、API、SSE、运行状态、渲染、题目 artifact、验证证据、视图与可访问性模块。</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/></marker>
    <style>
      .tb{font-size:15px;font-weight:600;fill:#0f172a}.t{font-size:12px;fill:#1e293b}.ts{font-size:10.5px;fill:#475569}
      .cur{fill:#fef2f2;stroke:#fca5a5;stroke-width:1.5}.mod{fill:#f0fdfa;stroke:#0d9488;stroke-width:1.5}
      .store{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.flag{font-size:10px;fill:#dc2626;font-weight:600}
      .good{font-size:10px;fill:#16a34a;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fdfdfd"/>
  <text x="40" y="40" class="tb" font-size="20">前端组件分解：现状 → 目标态（保留零构建原生架构）</text>
  <text x="40" y="62" class="ts">继承约束：无构建/框架 · 普通内容 DOM API/textContent · KaTeX 仅处理数学 · typed artifact/evidence 不从 Markdown 猜测</text>

  <!-- 现状 -->
  <text x="60" y="100" class="tb">现状</text>
  <rect x="60" y="112" width="380" height="330" class="cur" rx="8"/>
  <text x="80" y="138" class="tb" font-size="14">app.js — 单 IIFE 1114 行</text>
  <rect x="80" y="150" width="340" height="40" fill="#fff" stroke="#cbd5e1"/><text x="92" y="166" class="t">state（单例可变，直改）+ dom 缓存</text><text x="92" y="182" class="ts">JS state 与 DOM state 双轨</text>
  <rect x="80" y="196" width="340" height="34" fill="#fff" stroke="#cbd5e1"/><text x="92" y="217" class="t">api() 网络封装</text>
  <rect x="80" y="236" width="340" height="34" fill="#fff" stroke="#cbd5e1"/><text x="92" y="257" class="t">streamRun / consumeSSE（手写 SSE）</text>
  <rect x="80" y="276" width="340" height="34" fill="#fff" stroke="#cbd5e1"/><text x="92" y="297" class="t">renderSafeMarkdown（仅标题/列表/段落）</text>
  <rect x="80" y="316" width="340" height="34" fill="#fff" stroke="#cbd5e1"/><text x="92" y="337" class="t">setMode / bindEvents / 七模式表单</text>
  <rect x="80" y="356" width="340" height="34" fill="#fff" stroke="#cbd5e1"/><text x="92" y="377" class="t">会话/检视器/rail 渲染（全量重建）</text>
  <text x="80" y="412" class="flag">FE-11 函数不可导入 → 零行为测试</text>
  <text x="80" y="430" class="flag">FE-05/06 状态散改无回滚/跨会话残留 · FE-09 无数学渲染</text>

  <!-- 箭头 -->
  <line x1="450" y1="280" x2="510" y2="280" stroke="#0f766e" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="452" y="270" class="ts">模块化</text>

  <!-- 目标态 -->
  <text x="530" y="100" class="tb">目标态（原生 ES modules，仍无构建）</text>

  <!-- store 中心 -->
  <rect x="770" y="150" width="180" height="70" class="store" rx="8"/>
  <text x="790" y="176" class="tb" font-size="13">store.js</text>
  <text x="790" y="195" class="ts">单一状态源 + 订阅</text>
  <text x="790" y="211" class="good">✓ 切换会话集中重置</text>

  <rect x="530" y="150" width="200" height="52" class="mod" rx="6"/><text x="544" y="171" class="t">api.js</text><text x="544" y="188" class="ts">fetch + 422 错误规范化</text>
  <rect x="530" y="216" width="200" height="52" class="mod" rx="6"/><text x="544" y="237" class="t">sse.js</text><text x="544" y="254" class="ts">Last-Event-ID/去重/退避</text>
  <rect x="530" y="282" width="200" height="52" class="mod" rx="6"/><text x="544" y="303" class="t">runstate.js</text><text x="544" y="320" class="ts">run 状态机↔控件启用</text>
  <rect x="530" y="348" width="200" height="52" class="mod" rx="6"/><text x="544" y="369" class="t">render.js</text><text x="544" y="386" class="ts">DOM + KaTeX 安全渲染</text>
  <rect x="770" y="240" width="180" height="52" class="mod" rx="6"/><text x="784" y="261" class="t">views/（面板）</text><text x="784" y="278" class="ts">七模式/会话/检视器</text>
  <rect x="770" y="306" width="180" height="52" class="mod" rx="6"/><text x="784" y="327" class="t">views/artifact 中心</text><text x="784" y="344" class="ts">产物浏览/导出（新增）</text>
  <rect x="770" y="372" width="180" height="52" class="mod" rx="6"/><text x="784" y="393" class="t">a11y.js</text><text x="784" y="410" class="ts">焦点/aria/对比度 token</text>
  <rect x="970" y="240" width="170" height="52" class="mod" rx="6"/><text x="984" y="261" class="t">artifact.js</text><text x="984" y="278" class="ts">form/options/key/blanks</text>
  <rect x="970" y="306" width="170" height="52" class="mod" rx="6"/><text x="984" y="327" class="t">evidence.js</text><text x="984" y="344" class="ts">bound/compiled/checked</text>

  <!-- store 数据流 -->
  <line x1="730" y1="176" x2="768" y2="176" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="730" y1="242" x2="768" y2="190" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="730" y1="308" x2="768" y2="200" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="220" x2="860" y2="238" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="292" x2="860" y2="304" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#a)"/>
  <line x1="950" y1="200" x2="968" y2="250" stroke="#0891b2" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="1055" y1="292" x2="1055" y2="304" stroke="#0891b2" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="970" y1="332" x2="952" y2="332" stroke="#0891b2" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="955" y="185" class="ts">订阅→typed projection</text>

  <text x="530" y="450" class="good">✓ 模块可测 · 状态单源 · 错误规范化 · QuestionArtifact/EvidenceBinding 显式校验</text>

  <!-- 数据流管线 -->
  <rect x="60" y="490" width="1080" height="230" fill="#fff" stroke="#94a3b8" rx="8"/>
  <text x="80" y="516" class="tb">QuestionArtifact → 安全数学渲染（修 QG-01/02 + FE-09）</text>
  <rect x="80" y="530" width="180" height="56" fill="#f8fafc" stroke="#cbd5e1"/><text x="94" y="552" class="t">QuestionArtifact vN</text><text x="94" y="570" class="ts">form字段 + content markdown</text>
  <rect x="300" y="530" width="200" height="56" fill="#f0fdfa" stroke="#0d9488"/><text x="314" y="552" class="t">白名单解析</text><text x="314" y="570" class="ts">标题/列表/表格/代码/数学定界符</text>
  <rect x="540" y="530" width="200" height="56" fill="#f0fdfa" stroke="#0d9488"/><text x="554" y="552" class="t">KaTeX 渲染数学</text><text x="554" y="570" class="ts">throwOnError:false · trust:false</text>
  <rect x="780" y="530" width="200" height="56" fill="#f0fdfa" stroke="#0d9488"/><text x="794" y="552" class="t">非数学 → textContent</text><text x="794" y="570" class="ts">表格/代码用 DOM API 构建</text>
  <line x1="260" y1="558" x2="298" y2="558" stroke="#0f766e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="558" x2="538" y2="558" stroke="#0f766e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="740" y1="558" x2="778" y2="558" stroke="#0f766e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="80" y="614" class="good">✓ 普通内容不进 innerHTML · KaTeX trust:false · schema缺字段报错 · 渲染失败显原LaTeX</text>
  <rect x="80" y="630" width="1040" height="72" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="94" y="652" class="tb" font-size="13">签名元素：验证证据链面板</text>
  <text x="94" y="672" class="ts">显示 artifact/solution/verifier/toolchain digest binding；compiled_unbound 用琥珀，不得满足 required 或启用发布</text>
  <text x="94" y="690" class="ts">四态之外再呈现 bound/compiled/checked 层级与 execution manifest，使“验证”可审计而非只看绿色徽标</text>
</svg>
