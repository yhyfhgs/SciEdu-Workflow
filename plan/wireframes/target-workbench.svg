  <rect x="324" y="422" width="580" height="44" fill="#f6f8f8" stroke="#d7dde2"/>
  <text x="338" y="442" class="t">运行中… retrieve → generate → verify</text>
  <rect x="792" y="430" width="96" height="28" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="812" y="449" class="t">■ 停止</text>
  <text x="620" y="442" class="fix">FE-03 取消始终可用</text>
  <!-- 输入框 -->
  <rect x="324" y="720" width="580" height="64" fill="#fbfcfa" stroke="#c4ccd2"/>
  <text x="338" y="748" class="ts">输入命令…（⌘Enter 发送）</text>
  <rect x="812" y="742" width="80" height="30" class="btn"/><text x="838" y="762" class="btw">发送</text>
  <text x="338" y="778" class="fix">FE-04 ⌘Enter 走 in-flight 守卫，禁并发第二 run</text>

  <!-- 右栏 检视器 -->
  <rect x="934" y="120" width="322" height="680" class="rail"/>
  <rect x="948" y="134" width="294" height="200" fill="#fff" stroke="#0d9488" stroke-width="2"/>
  <text x="962" y="158" class="tb">验证证据链 ★（签名元素）</text>
  <circle cx="968" cy="182" r="6" class="ev-pass"/><text x="984" y="187" class="t">独立复核 passed · required</text>
  <circle cx="968" cy="210" r="6" class="ev-na"/><text x="984" y="215" class="t">数值验证 N/A · optional</text>
  <circle cx="968" cy="238" r="6" class="ev-warn"/><text x="984" y="243" class="t">Lean compiled_unbound · required</text>
  <circle cx="968" cy="266" r="6" class="ev-pass"/><text x="984" y="271" class="t">解题置信 passed</text>
  <text x="962" y="300" class="fix">overall: 阻断 formal 发布（QG-02 未绑定）</text>
  <text x="962" y="320" class="ts">manifest qg-7f2 · verifier spec lean-v2</text>

  <rect x="948" y="346" width="294" height="120" fill="#fff" stroke="#d7dde2"/>
  <text x="962" y="370" class="tb">知识引用</text>
  <rect x="962" y="380" width="266" height="30" fill="#fbfcfa" stroke="#e2e8f0"/><text x="974" y="399" class="ts">实分析.pdf · p.42 · 定积分中值定理</text>
  <text x="962" y="432" class="ts">📌 pin 到主题（多 pin 支持）</text>
  <text x="962" y="452" class="fix">FE-06 切会话时重置 pin</text>

  <rect x="948" y="478" width="294" height="100" fill="#fff" stroke="#d7dde2"/>
  <text x="962" y="502" class="tb">run 指标</text>
  <text x="962" y="524" class="ts">LLM调用 6 · tokens 4.2k · 8.3s</text>
  <text x="962" y="544" class="fix">effect usage.v1 · QG-06 重放不重复计费</text>

