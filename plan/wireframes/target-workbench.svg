  <line x1="40" y1="524" x2="278" y2="524" stroke="#d7dde2"/>
  <rect x="40" y="536" width="238" height="120" class="new"/>
  <text x="52" y="558" class="tb">review 队列 ★</text>
  <text x="52" y="578" class="ts">待复核生成题 3</text>
  <rect x="52" y="588" width="214" height="26" class="panel"/><text x="62" y="605" class="ts">题 #a1f2 · pending_concept</text>
  <rect x="52" y="618" width="214" height="26" class="panel"/><text x="62" y="635" class="ts">题 #b3c8 · 待人工确认</text>
