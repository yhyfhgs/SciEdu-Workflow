  <rect x="440" y="326" width="70" height="22" class="chip"/><text x="454" y="341" class="ts">证明</text>
  <rect x="518" y="326" width="110" height="22" class="chip"/><text x="532" y="341" class="ts">实分析</text>
  <rect x="342" y="356" width="110" height="28" class="panel"/><text x="356" y="375" class="ts">证据未绑定</text>
  <rect x="460" y="356" width="80" height="28" class="panel"/><text x="478" y="375" class="t">变式</text>
  <rect x="548" y="356" width="80" height="28" class="panel"/><text x="566" y="375" class="t">复制</text>
  <rect x="636" y="356" width="90" height="28" class="panel"/><text x="654" y="375" class="t">导出</text>
