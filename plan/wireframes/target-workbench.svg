  <rect x="962" y="646" width="266" height="30" fill="#fbfcfa" stroke="#e2e8f0"/><text x="974" y="665" class="ts">题 · 连续函数中值定理证明</text>
  <rect x="962" y="682" width="266" height="30" fill="#fbfcfa" stroke="#e2e8f0"/><text x="974" y="701" class="ts">试卷 · 线代期中（12 题）</text>
  <rect x="962" y="718" width="266" height="30" fill="#fbfcfa" stroke="#e2e8f0"/><text x="974" y="737" class="ts">讲义 · 实分析专题.pdf</text>
