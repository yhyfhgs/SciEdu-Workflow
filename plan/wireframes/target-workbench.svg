  <rect x="324" y="158" width="580" height="40" fill="#f6f8f8" stroke="#d7dde2"/><text x="338" y="182" class="t">▸ 生成一道实分析证明题，难度 6</text>
  <!-- artifact 卡片 -->
  <rect x="324" y="210" width="580" height="200" class="new"/>
  <text x="342" y="234" class="tb">QuestionArtifact v3</text><text x="720" y="234" class="newlabel">artifact/solution digest 已固定</text>
  <rect x="342" y="246" width="544" height="70" fill="#fbfcfa" stroke="#e2e8f0"/>
  <text x="356" y="270" class="t">设 f 在 [a,b] 连续，证明存在 ξ 使得</text>
  <text x="356" y="294" class="t" font-style="italic">∫ₐᵇ f(x)dx = f(ξ)(b−a)</text>
  <text x="740" y="270" class="fix">FE-09 KaTeX 渲染</text>
  <text x="356" y="309" class="ts" font-size="9">form=proof · choice/options/key、fill_blank/blanks 按 form 显示</text>
