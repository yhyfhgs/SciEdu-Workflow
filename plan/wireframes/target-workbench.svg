<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="workbench-title workbench-desc" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <title id="workbench-title">SciForge 可信生成与审阅工作台目标态</title>
  <desc id="workbench-desc">桌面三栏工作台，左侧会话和模板，中间结构化题目 artifact，右侧带绑定状态的验证证据、来源与运行指标。</desc>
  <defs>
    <style>
      .tb{font-size:14px;font-weight:600;fill:#0f172a}.t{font-size:12px;fill:#1e293b}.ts{font-size:10.5px;fill:#5a6b74}
      .panel{fill:#fff;stroke:#d7dde2;stroke-width:1}.rail{fill:#f6f8f8;stroke:#d7dde2;stroke-width:1}
      .new{fill:#eef7f5;stroke:#0d9488;stroke-width:1.5}.newlabel{font-size:9.5px;fill:#0d9488;font-weight:600}
      .fix{font-size:9.5px;fill:#dc2626;font-weight:600}
      .btn{fill:#245f7c;rx:5}.btw{font-size:11px;fill:#fff}
      .chip{fill:#eef2f5;stroke:#c4ccd2;stroke-width:1;rx:12}
      .ev-pass{fill:#16a34a}.ev-warn{fill:#d97706}.ev-fail{fill:#dc2626}.ev-na{fill:#94a3b8}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#eef1f2"/>
  <text x="32" y="34" class="tb" font-size="19">目标态工作台线框（桌面三栏 · 浅色学术工具气质 · 暗色主题镜像）</text>
  <text x="32" y="54" class="ts">🟢 绿框=新增真实功能  🔴 红标=修复点  · 窄屏左右栏收进 drawer（现有 inert+scrim 机制保留）</text>

  <!-- 顶栏 -->
  <rect x="24" y="66" width="1232" height="44" class="panel"/>
  <text x="44" y="93" class="tb">SciForge 工作台</text>
  <rect x="980" y="76" width="120" height="24" class="chip"/><text x="998" y="92" class="ts">◐ 明/暗 主题</text>
  <rect x="1112" y="76" width="120" height="24" class="chip"/><text x="1128" y="92" class="ts">● API 已连接</text>

  <!-- 左栏 -->
  <rect x="24" y="120" width="270" height="680" class="rail"/>
  <rect x="40" y="134" width="238" height="30" class="btn"/><text x="130" y="154" class="btw">+ 新会话</text>
  <text x="44" y="186" class="tb">会话</text>
  <rect x="40" y="196" width="238" height="30" class="panel"/><text x="52" y="216" class="t">连续函数专题</text><text x="250" y="216" class="ts">⋮</text>
  <rect x="40" y="230" width="238" height="30" class="panel"/><text x="52" y="250" class="t">群论习题变式</text><text x="250" y="250" class="ts">⋮</text>
  <rect x="40" y="264" width="238" height="30" class="panel"/><text x="52" y="284" class="t">线代期中组卷</text><text x="250" y="284" class="ts">⋮</text>
  <text x="44" y="312" class="ts">加载更多…</text>
  <text x="104" y="326" class="fix" font-size="8.5">FE-10/FB-17 操作 · FB-01 游标分页</text>

  <line x1="40" y1="330" x2="278" y2="330" stroke="#d7dde2"/>
  <text x="44" y="352" class="tb">模板 / 模式</text>
  <rect x="40" y="362" width="238" height="28" class="panel"/><text x="52" y="381" class="t">01 出新题</text>
  <rect x="40" y="394" width="238" height="28" class="panel"/><text x="52" y="413" class="t">独立求解</text>
  <rect x="40" y="426" width="238" height="28" class="new"/><text x="52" y="445" class="t">组卷 ★</text><text x="200" y="445" class="newlabel">真实组卷</text>
  <rect x="40" y="458" width="238" height="28" class="new"/><text x="52" y="477" class="t">讲义 ★</text><text x="200" y="477" class="newlabel">真检索+PDF</text>
