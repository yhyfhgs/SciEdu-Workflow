# SciForge LLM 配置示例
#
# 使用方法:
#   1. 复制本文件: cp config/sciforge.example.toml config/sciforge.toml
#   2. 通过 CLI 指定: sciforge parse run --llm-config config/sciforge.toml ...
#   3. 或通过环境变量: SCIFORGE_LLM_CONFIG_FILE=config/sciforge.toml

[llm]
# 全局默认配置（可被 per-task 配置覆盖）
provider = "anthropic"
model = "claude-sonnet-4-20250514"

# ── Pipeline 任务（必填）────────────────────────────────
#
# Producer-Consumer 流水线只需两个 LLM 任务:
#   1. vlm_convert         - Phase A: 多模态识别 PDF/DOCX → markdown
#   2. extract_and_classify - Task1: 单次调用做 提取+校正+分类+打标签+难度

[llm.tasks.vlm_convert]
# Phase A: VLM 视觉识别（必须支持图像输入！）
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[llm.tasks.extract_and_classify]
# Task1: 一次 LLM 调用完成提取/校正/分类/打标签/难度评估
# JSON 输出量较大（一窗口可能含多个 item + tag 子树），max_tokens 建议 ≥ 32k
provider = "anthropic"
model = "claude-sonnet-4-20250514"
max_tokens = 32768

# ── 生成引擎任务（按需启用，与 parse pipeline 无关）──────

[llm.tasks.generate]
# 题目生成：需要创造力
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[llm.tasks.solve]
# 基础求解：需要精确推理
provider = "openai"
model = "gpt-4o"

[llm.tasks.solve_deep]
# 深度求解（多轮 + tool calling）
provider = "anthropic"
model = "claude-sonnet-4-20250514"
max_tokens = 32768

[llm.tasks.review]
# 验证审阅：可用较轻量模型
provider = "anthropic"
model = "claude-haiku-4-20250514"

[llm.tasks.tag]
# 难度标注（生成路径独立于 Pipeline tag 树）
provider = "anthropic"
model = "claude-haiku-4-20250514"

[llm.tasks.improve]
# 迭代改进
provider = "openai"
model = "gpt-4o"
