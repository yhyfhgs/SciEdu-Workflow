  <!-- 图例 -->
  <rect x="40" y="820" width="210" height="60" fill="#fff" stroke="#cbd5e1"/>
  <text x="50" y="838" class="ts" font-weight="600">图例</text>
  <rect x="50" y="846" width="16" height="12" class="box"/><text x="72" y="856" class="ts">组件</text>
  <rect x="120" y="846" width="16" height="12" fill="#fff" class="crit"/><text x="142" y="856" class="ts">含Crit/High缺陷</text>
  <text x="50" y="874" class="flag">红=缺陷</text><text x="120" y="874" class="good">绿=已加固/正面</text>
</svg>
