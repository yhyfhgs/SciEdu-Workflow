<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1020" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="qgen-title qgen-desc" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
  <title id="qgen-title">QGen Agent Harness 当前控制图与重审边界</title>
  <desc id="qgen-desc">展示 QGen 状态图、持久运行时、验证沙箱和 LLM 分层，并标注 QuestionArtifact、EvidenceBinding、RunManifest、执行来源与成本调度缺口。</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .tb{font-size:15px;font-weight:600;fill:#0f172a}.t{font-size:12px;fill:#1e293b}.ts{font-size:10.5px;fill:#475569}
      .node{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.box{fill:#fff;stroke:#6366f1;stroke-width:1.3}
      .crit{stroke:#dc2626;stroke-width:2.5}.flag{font-size:10px;fill:#dc2626;font-weight:600}
      .good{font-size:10px;fill:#16a34a;font-weight:600}.warn{fill:#fffbeb;stroke:#d97706;stroke-width:1.3}
      .comp{fill:#eff6ff;stroke:#3b82f6;stroke-width:1}
    </style>
  </defs>
  <rect width="1340" height="1020" fill="#fdfdfd"/>
  <text x="40" y="40" class="tb" font-size="21">QGen Agent Harness 内部架构（现状）</text>
  <text x="40" y="62" class="ts">教育规则 + durable primitives · 有界反馈图（非开放式 agentic loop）· artifact/evidence/manifest/effect 语义仍不闭合</text>

  <!-- StateGraph -->
  <rect x="40" y="85" width="760" height="300" fill="#faf5ff" stroke="#c4b5fd" rx="8"/>
  <text x="52" y="107" class="tb">StateGraph 10 节点（agent.py，_MAX_GRAPH_STEPS=400 熔断）</text>
  <rect x="60" y="125" width="90" height="46" class="node" rx="4"/><text x="70" y="145" class="t">retrieve</text><text x="70" y="162" class="ts">0-LLM SQL</text>
  <rect x="180" y="125" width="90" height="46" class="node" rx="4"/><text x="190" y="145" class="t">generate</text><text x="190" y="162" class="ts">n=3串行</text>
  <rect x="300" y="125" width="80" height="46" class="node" rx="4"/><text x="310" y="145" class="t">next</text><text x="310" y="162" class="ts">路由</text>
  <rect x="410" y="125" width="90" height="46" class="node" rx="4"/><text x="420" y="145" class="t">prefilter</text><text x="420" y="162" class="ts">0-LLM</text>
  <rect x="530" y="125" width="90" height="46" class="node" rx="4"/><text x="540" y="145" class="t">solve</text><text x="540" y="162" class="ts">deep≤5轮</text>
  <rect x="650" y="125" width="90" height="46" class="node crit" rx="4"/><text x="660" y="145" class="t">verify</text><text x="660" y="162" class="ts">多路径</text>
  <rect x="410" y="220" width="90" height="46" class="node" rx="4"/><text x="420" y="240" class="t">annotate</text><text x="420" y="257" class="ts">END / next</text>
  <rect x="530" y="220" width="90" height="46" class="node crit" rx="4"/><text x="540" y="240" class="t">evolve</text><text x="540" y="257" class="ts">solve / next</text>
  <rect x="650" y="220" width="90" height="46" class="node" rx="4"/><text x="660" y="240" class="t">diagnose</text><text x="660" y="257" class="ts">evolve / next</text>
  <rect x="290" y="220" width="90" height="46" class="node crit" rx="4"/><text x="300" y="240" class="t">select</text><text x="300" y="257" class="ts" font-size="10">常数目标→END</text>
  <line x1="150" y1="148" x2="178" y2="148" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="270" y1="148" x2="298" y2="148" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="148" x2="408" y2="148" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="148" x2="528" y2="148" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="620" y1="148" x2="648" y2="148" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="695" y1="171" x2="695" y2="219" stroke="#dc2626" stroke-width="1.3" marker-end="url(#af)"/><text x="700" y="200" class="ts">fail</text>
  <line x1="650" y1="243" x2="620" y2="243" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="575" y1="220" x2="575" y2="173" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/><text x="580" y="200" class="ts">evolved</text>
  <line x1="610" y1="171" x2="665" y2="219" stroke="#dc2626" stroke-width="1.3" marker-end="url(#af)"/><text x="625" y="184" class="ts">bad</text>
  <polyline points="660,171 640,190 510,190 510,243 502,243" fill="none" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#a)"/><text x="512" y="185" class="ts">pass</text>
  <line x1="455" y1="219" x2="380" y2="171" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#a)"/><text x="405" y="194" class="ts">population</text>
  <line x1="335" y1="171" x2="335" y2="219" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#a)"/><text x="340" y="200" class="ts">select</text>
  <text x="52" y="300" class="flag">QG-01 options/key/blanks 不贯穿 solve/verify/evolve/export；evolve 改题干可复用旧答案且跳过 prefilter</text>
  <text x="52" y="320" class="flag">QG-08 correctness/evidence 近常数 · QG-09 3候选串行全生成 · GN-18 LIMIT500后排序</text>
  <text x="52" y="340" class="good">✓ 三层熔断(400步+rounds) · 求解-审核分离 · 死循环有测试</text>
  <text x="52" y="360" class="ts">性质：有界反馈图，diagnose 为规则路由（非 LLM 自主规划）· 工具集中在 deep_solver 内</text>

  <!-- Durable -->
  <rect x="820" y="85" width="480" height="300" fill="#fef2f2" stroke="#fca5a5" rx="8"/>
  <text x="832" y="107" class="tb">DurableQGenHarness + SQLiteRunStore</text>
  <rect x="832" y="118" width="456" height="70" class="box"/><text x="842" y="137" class="t">Run 状态机 PENDING→RUNNING⇄PAUSED→终态</text><text x="842" y="154" class="ts">node-boundary resume（已完成节点不重放）</text><text x="842" y="171" class="ts">checkpoint 不可变(触发器) · event 单调(MAX+1写锁内)</text>
  <rect x="832" y="194" width="456" height="40" class="box crit"/><text x="842" y="213" class="t">预算 4 维（steps/calls/tokens/wall_time）</text><text x="842" y="229" class="flag">HR-03 事后记账非预留·单节点内可超支·delta丢失</text>
  <rect x="832" y="240" width="456" height="40" class="box crit"/><text x="842" y="259" class="t">resume / cancel / startup 恢复</text><text x="842" y="275" class="flag">HR-01 无 worker fencing → 误杀健康 run</text>
  <rect x="832" y="286" width="456" height="36" class="box crit"/><text x="842" y="308" class="t">QG-03 --llm-config 未贯穿 QGen flags / sandbox</text>
  <text x="832" y="342" class="flag">QG-05 checkpoint 无 model/prompt/tool/schema manifest · QG-06 effect/usage 非幂等</text>
  <text x="832" y="360" class="flag">HR-01 无 lease · HR-15 complete_step与checkpoint非原子</text>
  <text x="832" y="378" class="flag">HR-02 cancel复合卡死 · HR-04 API默认预算无限</text>

  <!-- 验证沙箱 -->
  <rect x="40" y="405" width="620" height="300" fill="#fef2f2" stroke="#fca5a5" rx="8"/>
  <text x="52" y="427" class="tb">多路径验证 + VerificationSandbox</text>
  <rect x="54" y="438" width="290" height="90" class="box crit"/><text x="64" y="457" class="t" font-weight="600">四态证据 passed/failed/unavailable/error</text><text x="64" y="475" class="ts">checks: solve_confidence / review_passed /</text><text x="64" y="491" class="ts">non_trivial / solution_relevant [/numerical /lean]</text><text x="64" y="509" class="good">✓ required 状态可阻断 unavailable/error</text><text x="64" y="524" class="flag">QG-02 passed 未证明绑定当前题解</text>
  <rect x="354" y="438" width="292" height="90" class="box crit"/><text x="364" y="457" class="t" font-weight="600">容器沙箱（container_required）</text><text x="364" y="475" class="ts">network none·read-only·cap-drop ALL·非root</text><text x="364" y="491" class="ts">no-new-privileges·pids/mem/tmpfs noexec</text><text x="364" y="509" class="good">✓ OCI 参数有多层约束 · argv 无 shell</text><text x="364" y="524" class="flag">QG-04 trusted_local 未验证 provenance</text>
  <rect x="54" y="536" width="592" height="90" class="warn"/><text x="64" y="555" class="t" font-weight="600">验证有效性与执行来源缺陷</text><text x="64" y="574" class="flag">QG-02 任意 Lean theorem 编译可通过；需 artifact/solution/verifier/toolchain digest binding</text><text x="64" y="592" class="flag">SB-02 默认程序验证关 · SB-04 同模型自证 · SB-06 stdout 子串判定</text><text x="64" y="610" class="flag">QG-04 模型代码可走 trusted_local · SB-07 默认镜像无 Mathlib</text>
  <text x="52" y="648" class="flag">SB-01 core/sandbox.py 无隔离裸子进程 + deep_solver docstring 谎报（当前生产零调用，隐患）</text>
  <text x="52" y="666" class="flag">SB-03 真实容器路径全 mock 从未执行测试 · 无"故意错解"夹具</text>
  <text x="52" y="684" class="flag">SB-05 无随机种子无反例强度 · SB-08 异常路径遗留容器</text>

  <!-- LLM Client -->
  <rect x="680" y="405" width="620" height="180" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
  <text x="692" y="427" class="tb">LLM Client 分层（client.py 1008行）</text>
  <rect x="692" y="438" width="600" height="52" class="box"/><text x="702" y="457" class="t">双层 Semaphore · generate/json/vision/tool multiturn · Batches API</text><text x="702" y="475" class="ts">retry: schema feedback · 429不计次长睡6h · 能力矩阵过滤 · 异常归一化</text>
  <text x="692" y="510" class="ts">backends: Anthropic / AnthropicCompatible / OpenAI / OpenAICompatible / Gemini</text>
  <text x="692" y="530" class="flag">QG-09 长静态指令仍在 user prompt；cache system 前缀利用不足</text>
  <text x="692" y="548" class="flag">HR-05 usage 多路径缺失 · client.last_usage 并发共享竞态</text>
  <text x="692" y="568" class="flag">HR-11/12/13 max_completion_tokens缺失·截断重抓仅Anthropic·_extract_text只取首block</text>

  <!-- 9 组件覆盖 -->
  <rect x="40" y="725" width="1260" height="270" fill="#fff" stroke="#94a3b8" rx="8"/>
  <text x="52" y="748" class="tb">简报要求的 9 大 Harness 组件 — 实现覆盖</text>
  <rect x="54" y="760" width="405" height="34" class="comp"/><text x="64" y="781" class="t">1 LLM 调用 ◑ 已实现有缺口（无stream/failover/成本 HR-06）</text>
  <rect x="465" y="760" width="405" height="34" class="comp"/><text x="475" y="781" class="t">2 控制流 ● 有界反馈图（非开放规划，合理取舍）</text>
  <rect x="876" y="760" width="424" height="34" class="comp"/><text x="886" y="781" class="t">3 Extended reasoning ◑ thinking+deep solve · QGen preset 未启</text>
  <rect x="54" y="800" width="405" height="34" class="comp warn"/><text x="64" y="821" class="t">4 Long-horizon ◑ primitives扎实；缺lease/manifest/effect幂等</text>
  <rect x="465" y="800" width="405" height="34" class="comp"/><text x="475" y="821" class="t">5 Long-context ◑ 条数截断非token，无embedding/分块</text>
  <rect x="876" y="800" width="424" height="34" class="comp"/><text x="886" y="821" class="t">6 Context压缩 ◑ 截断式快照(8条×1200字)，无摘要</text>
  <rect x="54" y="840" width="405" height="34" class="comp"/><text x="64" y="861" class="t">7 Session管理 ● 产品层ConversationStore，边界清晰</text>
  <rect x="465" y="840" width="405" height="34" class="comp"/><text x="475" y="861" class="t">8 Template/Skills ◑ 静态.txt+lru，无运行时注册/版本化</text>
  <rect x="876" y="840" width="424" height="34" class="comp warn"/><text x="886" y="861" class="t">9 Memory系统 ○ 未实现（lineage/population仅provenance）</text>
  <text x="52" y="895" class="tb" font-size="13">教育特化评估：规则层真实，端到端契约仍部分</text>
  <text x="52" y="915" class="ts">已有：确定性题型预筛 · 10维难度 · 按题型选择验证路径 · prompt教学约束</text>
  <text x="52" y="935" class="flag">QG-01 结构题型不守恒 · QG-07 solve硬编码数学 · GN-13 非数学模板词面化 · QG-08 population目标退化</text>
  <text x="52" y="962" class="ts">图例：● 实现良好 ◑ 部分/有缺陷 ○ 未实现 · 蓝框=组件 · 红=Crit/High缺陷 · 绿=正面 · 黄=部分</text>
  <text x="52" y="982" class="ts">输出：新题/变式◑(结构字段断链) · 讲义◑(lite) · 组卷◑(取前N) · 导出◑(字段不全/无PDF) · 教材○</text>
</svg>
